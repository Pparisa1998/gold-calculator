<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>คำนวณราคาทอง</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- หัวข้อ -->
        <h1>คำนวณราคาทอง</h1>


        <!-- ราคาทองวันนี้ -->
        <div class="today-price">

            <div id="goldPriceToday">
                ราคาทองวันนี้ กำลังโหลด...
            </div>

            <div id="goldUpdateTime">
                อัปเดตล่าสุด --:-- น.
            </div>

        </div>


        <!-- ราคาทอง -->
        <div class="form-group">

            <label>ราคาทอง</label>

            <input
                type="number"
                id="goldPrice"
                placeholder="  "
            >

        </div>


        <!-- เปอร์เซ็นต์ทอง -->
        <div class="form-group">

            <label>เปอร์เซ็นต์ทอง</label>

            <input
                type="number"
                id="goldPercent"
                placeholder=" "
            >

        </div>


        <!-- น้ำหนัก -->
        <div class="form-group">

            <label>น้ำหนัก (กรัม)</label>

            <input
                type="number"
                id="goldWeight"
                placeholder=""
                step="0.01"
            >

        </div>


        <!-- ปุ่มคำนวณ -->
        <button onclick="calculate()">
            คำนวณ
        </button>


        <!-- ผลลัพธ์ -->
        <div id="result"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
